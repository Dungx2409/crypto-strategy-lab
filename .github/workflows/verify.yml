name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  maven-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check static JavaScript syntax
        run: |
          node --check api-app/src/main/resources/static/result-ui.js
          node --check api-app/src/main/resources/static/lab.js
          node --check api-app/src/main/resources/static/account-features.js

      - name: Verify Maven reactor
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
