spring:
  application:
    name: crypto-strategy-lab-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/crypto_strategy_lab}
    username: ${POSTGRES_USER:crypto_lab}
    password: ${POSTGRES_PASSWORD:crypto_lab_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    time-zone: UTC
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:crypto_lab}
    password: ${RABBITMQ_PASSWORD:crypto_lab_dev}
    publisher-confirm-type: correlated
    publisher-returns: true

server:
  port: ${API_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-components: always
      show-details: when_authorized

crypto:
  security:
    admin-usernames: ${CRYPTO_ADMIN_USERNAMES:}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      timeout: 30s
  market:
    provider: ${CRYPTO_MARKET_PROVIDER:binance}
    symbol-default: BTCUSDT
    supported-symbols: ${CRYPTO_MARKET_SUPPORTED_SYMBOLS:BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT}
    maximum-limit: 1000
    binance:
      rest-url: ${BINANCE_REST_URL:https://api.binance.com/api/v3/klines}
      websocket-url: ${BINANCE_WEBSOCKET_URL:wss://stream.binance.com:9443/ws}
      connect-timeout: 5s
      request-timeout: 10s
    okx:
      rest-url: ${OKX_REST_URL:https://www.okx.com/api/v5/market/history-candles}
      websocket-url: ${OKX_WEBSOCKET_URL:wss://ws.okx.com:8443/ws/v5/public}
      connect-timeout: 5s
      request-timeout: 10s
    reconnect:
      initial-delay-ms: 1000
      max-delay-ms: 30000
  search:
    generator: ${CRYPTO_SEARCH_GENERATOR:random}
    default-max-candidates: 125
  discovery:
    poll-interval: ${DISCOVERY_POLL_INTERVAL:1m}
  backtest:
    queue: crypto.backtest.jobs
    max-retries: 3
    dispatch:
      publisher-enabled: true
      batch-size: 50
      poll-interval: 500
      confirm-timeout: 5s
  domain-events:
    publisher-enabled: true
    batch-size: 50
    poll-interval: 500
    confirm-timeout: 5s
    realtime:
      concurrency: ${REALTIME_EVENT_CONCURRENCY:1}
      prefetch: ${REALTIME_EVENT_PREFETCH:10}
  news:
    provider: ${NEWS_PROVIDER:html}
    allowed-hosts: ${NEWS_ALLOWED_HOSTS:}
    connect-timeout: 5s
    request-timeout: 10s
    maximum-items: 50
    initial-lookback: 24h
    cryptocompare:
      url: ${NEWS_API_URL:https://min-api.cryptocompare.com/data/v2/news/}
      api-key: ${NEWS_API_KEY:}
    collection:
      initial-delay: 30s
      interval: 5m
  sentiment:
    provider: ${SENTIMENT_PROVIDER:huggingface}
    max-attempts: 2
    huggingface:
      endpoint: ${HF_FINBERT_ENDPOINT:https://router.huggingface.co/hf-inference/models/ProsusAI/finbert}
      token: ${HF_TOKEN:}
      model: ${HF_FINBERT_MODEL:ProsusAI/finbert}
      revision: ${HF_FINBERT_REVISION:4556d13015211d73dccd3fdd39d39232506f3e43}
      connect-timeout: 5s
      request-timeout: 20s
  provenance:
    git-commit: ${APP_GIT_COMMIT:dev}
    build-version: ${APP_BUILD_VERSION:dev}
