x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crypto_strategy_lab}
      POSTGRES_USER: ${POSTGRES_USER:-crypto_lab}
      # No default fallback for secrets: CD must fail fast if this isn't set
      # in the environment/.env, rather than silently deploying a known password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      TZ: UTC
    ports:
      # Bound to localhost only — DB should never be reachable from outside the
      # host directly. Use an SSH tunnel or a bastion for ad-hoc access.
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # NOTE: deploy.resources.limits/reservations only take effect under
    # `docker stack deploy` (Swarm) or `docker compose --compatibility up`.
    # A plain `docker compose up` on Compose CLI v2.20+ does honor limits
    # natively, but confirm the Compose version your CD runner uses.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-crypto_lab}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      TZ: UTC
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      # Persist queue/message data across restarts and deploys.
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging: *default-logging

  api:
    image: ${REGISTRY:-crypto-strategy-lab}/api:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        APP_MODULE: api-app
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-crypto_strategy_lab}
      POSTGRES_USER: ${POSTGRES_USER:-crypto_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-crypto_lab}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      DEFAULT_ACCOUNT_ENABLED: ${DEFAULT_ACCOUNT_ENABLED:-true}
      DEFAULT_ACCOUNT_USERNAME: ${DEFAULT_ACCOUNT_USERNAME:-demo}
      DEFAULT_ACCOUNT_PASSWORD: ${DEFAULT_ACCOUNT_PASSWORD:-crypto-demo}
      CRYPTO_SEARCH_GENERATOR: ${CRYPTO_SEARCH_GENERATOR:-random}
      CRYPTO_MARKET_PROVIDER: ${CRYPTO_MARKET_PROVIDER:-binance}
      CRYPTO_MARKET_SUPPORTED_SYMBOLS: ${CRYPTO_MARKET_SUPPORTED_SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT}
      CRYPTO_MARKET_MAXIMUM_RANGE_CANDLES: ${CRYPTO_MARKET_MAXIMUM_RANGE_CANDLES:-20000}
      BINANCE_REST_URL: ${BINANCE_REST_URL:-https://api.binance.com/api/v3/klines}
      BINANCE_WEBSOCKET_URL: ${BINANCE_WEBSOCKET_URL:-wss://stream.binance.com:9443/ws}
      OKX_REST_URL: ${OKX_REST_URL:-https://www.okx.com/api/v5/market/history-candles}
      OKX_WEBSOCKET_URL: ${OKX_WEBSOCKET_URL:-wss://ws.okx.com:8443/ws/v5/public}
      NEWS_PROVIDER: ${NEWS_PROVIDER:-all}
      NEWS_API_URL: ${NEWS_API_URL:-https://min-api.cryptocompare.com/data/v2/news/}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      NEWS_RSS_URLS: ${NEWS_RSS_URLS:-}
      SENTIMENT_PROVIDER: ${SENTIMENT_PROVIDER:-keyword}
      CRAWLER_CHECK_INTERVAL: ${CRAWLER_CHECK_INTERVAL:-15m}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      HUGGINGFACE_URL: ${HUGGINGFACE_URL:-https://router.huggingface.co/hf-inference/models/ProsusAI/finbert}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging: *default-logging

  worker:
    image: ${REGISTRY:-crypto-strategy-lab}/worker:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        APP_MODULE: worker-app
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-crypto_strategy_lab}
      POSTGRES_USER: ${POSTGRES_USER:-crypto_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-crypto_lab}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      SPRING_FLYWAY_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging: *default-logging

volumes:
  postgres-data:
  rabbitmq-data: